<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16362d">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Al Musk">
  <title>Al Musk Учёт</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">AL MUSK</span>
      <span class="sub">учёт смены</span>
    </div>
    <div class="role" id="roleBox"></div>
    <div class="datebar" id="dateBar">
      <button class="icon-btn" data-act="prevDay" aria-label="Предыдущий день">‹</button>
      <input type="date" id="dateInput" aria-label="Дата смены">
      <button class="icon-btn" data-act="nextDay" aria-label="Следующий день">›</button>
      <button class="chip" data-act="goToday" id="todayBtn">Сегодня</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view"><div class="loading">Загрузка…</div></main>
  <nav class="tabs" id="tabs" hidden>
    <button data-tab="cabinet">Кабинет<span class="dot" id="discDot" hidden></span></button>
    <button data-tab="dash">Дашборд</button>
    <button data-tab="shift">Смена</button>
    <button data-tab="reports">Отчёты</button>
    <button data-tab="disc">Контроль</button>
    <button data-tab="ref">Справочник</button>
  </nav>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="login" class="login" hidden>
    <form id="loginForm" class="login-card">
      <div class="logo big">AL MUSK</div>
      <p>Введите PIN для входа</p>
      <p class="small muted">PIN руководителя открывает кабинет, PIN продавцов открывает смену магазина.</p>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required>
      <label class="check" style="justify-content:center"><input type="checkbox" id="rememberIn"> Запомнить на этом устройстве</label>
      <p class="hint">На общем телефоне магазина не ставьте галочку при входе руководителя: вход сбросится после 15 минут без действий.</p>
      <p class="err" id="loginErr"></p>
      <button class="btn primary big">Войти</button>
    </form>
  </div>
  <datalist id="oilList"></datalist>
  <datalist id="goodsList"></datalist>
  <datalist id="sellerNames"></datalist>
  <script src="calc.js"></script>
  <script src="seed.js"></script>
  <script src="dash.js"></script>
  <script src="app.js"></script>
</body>
</html>
