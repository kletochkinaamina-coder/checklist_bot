<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Квиз Амины</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap" style="max-width: 460px;">
    <div class="center">
      <div class="logo">Квиз <span>Амины</span></div>
      <p class="sub">Введи PIN с экрана ведущего и соревнуйся с друзьями</p>
    </div>
    <div class="card">
      <form id="joinForm">
        <div class="field">
          <label for="pin">PIN игры</label>
          <input id="pin" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="name">Твоё имя</label>
          <input id="name" maxlength="16" placeholder="Например, Данияр" autocomplete="off" required>
        </div>
        <button class="btn primary" type="submit">Войти в игру</button>
      </form>
    </div>
    <p class="center" style="margin-top: 28px; opacity: 0.8;">
      Ты ведущий? <a href="/host">Создать игру</a>
    </p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('pin')) document.getElementById('pin').value = params.get('pin');
    try { const n = localStorage.getItem('quiz.name'); if (n) document.getElementById('name').value = n; } catch (_) {}
    document.getElementById('joinForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const pin = document.getElementById('pin').value.trim();
      const name = document.getElementById('name').value.trim();
      try { localStorage.setItem('quiz.name', name); } catch (_) {}
      location.href = `/play?pin=${encodeURIComponent(pin)}&name=${encodeURIComponent(name)}`;
    });
  </script>
</body>
</html>
